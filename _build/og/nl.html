<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#070b18;color:#f2f6ff;
 font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center}
.b{position:absolute;border-radius:50%;filter:blur(80px)}
.b1{width:620px;height:620px;background:#2563eb;top:-200px;left:-140px;opacity:.72}
.b2{width:520px;height:520px;background:#7c3aed;bottom:-190px;right:120px;opacity:.66}
.b3{width:420px;height:420px;background:#06b6d4;top:180px;left:380px;opacity:.34}
.in{position:relative;z-index:3;padding:0 0 0 64px;width:640px}
.lg{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.lg img{width:52px;height:52px;object-fit:contain}
.lg span{font-size:27px;font-weight:800;letter-spacing:-.03em}
h1{font-size:48px;line-height:1.05;letter-spacing:-.035em;font-weight:800}
h1 .grad{background:linear-gradient(100deg,#7dd3fc,#60a5fa 40%,#a78bfa);-webkit-background-clip:text;color:transparent}
p{margin-top:22px;font-size:21px;color:#93a3c4;max-width:33ch;line-height:1.45;font-weight:500}
.ph{position:absolute;right:-52px;top:50%;transform:translateY(-50%) rotate(-5deg);width:392px;z-index:1;
 filter:drop-shadow(0 40px 60px rgba(0,0,0,.65))}
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;
 background:linear-gradient(100deg,#070b18 34%,rgba(7,11,24,.72) 50%,rgba(7,11,24,0) 68%)}
</style></head><body>
<div class="b b1"></div><div class="b b2"></div><div class="b b3"></div>
<img class="ph" src="/img/nl/scan.webp">
<div class="scrim"></div>
<div class="in">
  <div class="lg"><img src="/fridgy-logo.png"><span>Fridgy</span></div>
  <h1>&euro;290 weggegooid in de prullenbak<br><span class="grad">elk jaar. Wij lossen dat op.</span></h1>
  <p>Fridgy helpt je voedselverspilling te verminderen: scan je kassabon, organiseer je koelkast en ontvang recepten op basis van wat je al thuis hebt.</p>
</div></body></html>
