<script>
  // Fallback pe client, dacă edge function-ul n-a redirecționat (ex. iPad cu UA de Mac).
  (function () {
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    if (ios) location.replace('https://apps.apple.com/app/id6748481042');
    else if (/Android/i.test(ua)) location.replace('https://play.google.com/store/apps/details?id=com.madreamircea.fridgy');
  })();
</script>
